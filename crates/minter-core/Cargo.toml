[package]
name = "minter-core"
version = "0.1.0"
edition = "2024"
description = "Shared mint/vault/RPC logic for MINTER desktop"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Anda4ka/minter-rs"
homepage = "https://github.com/Anda4ka/minter-rs"
documentation = "https://github.com/Anda4ka/minter-rs#readme"
readme = "../../README.md"
authors = ["Andark <andarx4nok@gmail.com>"]
keywords = ["nft", "mint", "opensea", "ethereum", "tauri"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
alloy = { version = "1", features = ["signer-local", "providers", "rpc-client", "rpc-types", "network"] }
alloy-primitives = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "http2", "cookies", "socks"] }
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
getrandom = "0.2"
k256 = "0.13"
chrono = "0.4"
anyhow = "1"
dotenvy = "0.15"
