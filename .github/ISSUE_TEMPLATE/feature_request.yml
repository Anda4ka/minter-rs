name: Feature request
description: Suggest an improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Keep scope realistic for a local Windows tool.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other products you tried.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope checks
      options:
        - label: This stays local (no required cloud backend / telemetry)
        - label: I understand burner-wallet / no-mint-guarantee product rules
