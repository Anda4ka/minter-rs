name: Bug report
description: Something is broken or unexpected
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. **Never paste private keys, vault passwords, full `config.json`, or live proxy credentials.**

        Security issues that can leak keys or forge transactions → see [SECURITY.md](https://github.com/Anda4ka/minter-rs/blob/main/SECURITY.md) (private report only).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug.
      placeholder: Steps, expected vs actual…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Redact secrets.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: App version (sidebar) or git commit / release tag.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows 11
        - Windows 10
        - Other (describe in notes)
    validations:
      required: true
  - type: dropdown
    id: path
    attributes:
      label: Feature area
      options:
        - OpenSea Tasks / mint
        - Raw Mint / sniper
        - Vault / wallets
        - RPC / Settings
        - Proxies
        - WL Check
        - Sweep / Disperse / Multicall
        - UI / i18n
        - Build / install
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (redacted)
      description: Relevant lines from the in-app log or `logs/` folder. Strip API keys and addresses you care about if needed.
      render: text
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Chain, drop slug (public), screenshots (no secrets on screen).
